name: Sync hreflang + OG images

on:
  push:
    branches: [main]

concurrency:
  group: sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install rsvg-convert and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin fontconfig fonts-noto-cjk fonts-noto-color-emoji
          mkdir -p ~/.local/share/fonts
          curl -fsSL "https://cdn.jsdelivr.net/fontsource/fonts/special-elite@latest/latin-400-normal.ttf" -o ~/.local/share/fonts/special-elite.ttf
          curl -fsSL "https://cdn.jsdelivr.net/fontsource/fonts/jetbrains-mono@latest/latin-400-normal.ttf" -o ~/.local/share/fonts/jetbrains-mono-400.ttf
          curl -fsSL "https://cdn.jsdelivr.net/fontsource/fonts/jetbrains-mono@latest/latin-700-normal.ttf" -o ~/.local/share/fonts/jetbrains-mono-700.ttf
          curl -fsSL "https://cdn.jsdelivr.net/fontsource/fonts/pangolin@latest/latin-400-normal.ttf" -o ~/.local/share/fonts/pangolin-latin.ttf
          curl -fsSL "https://cdn.jsdelivr.net/fontsource/fonts/pangolin@latest/cyrillic-400-normal.ttf" -o ~/.local/share/fonts/pangolin-cyrillic.ttf
          curl -fsSL "https://cdn.jsdelivr.net/fontsource/fonts/pangolin@latest/latin-ext-400-normal.ttf" -o ~/.local/share/fonts/pangolin-latin-ext.ttf
          curl -fsSL "https://cdn.jsdelivr.net/fontsource/fonts/ma-shan-zheng@latest/chinese-simplified-400-normal.ttf" -o ~/.local/share/fonts/ma-shan-zheng.ttf || true
          curl -fsSL "https://cdn.jsdelivr.net/fontsource/fonts/lxgw-wenkai-tc@latest/chinese-traditional-400-normal.ttf" -o ~/.local/share/fonts/lxgw-wenkai-tc.ttf || true
          curl -fsSL "https://cdn.jsdelivr.net/fontsource/fonts/noto-sans-tc@latest/chinese-traditional-400-normal.ttf" -o ~/.local/share/fonts/noto-sans-tc.ttf || true
          curl -fsSL "https://cdn.jsdelivr.net/fontsource/fonts/noto-sans-devanagari@latest/devanagari-400-normal.ttf" -o ~/.local/share/fonts/noto-sans-devanagari.ttf || true
          fc-cache -f

      - name: Sort translations.json alphabetically
        run: |
          node -e "
            const fs = require('fs');
            const p = 'assets/translations.json';
            const data = JSON.parse(fs.readFileSync(p, 'utf8'));
            const sorted = [...data.languages].sort((a, b) => a.code.localeCompare(b.code));
            const changed = sorted.some((s, i) => s.code !== data.languages[i].code);
            if (!changed) { console.log('translations.json already sorted.'); process.exit(0); }
            data.languages = sorted;
            fs.writeFileSync(p, JSON.stringify(data, null, 2) + '\n');
            console.log('translations.json was not sorted, fixed.');
          "
          if [ -n "$(git diff assets/translations.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/translations.json
            git commit -m "chore: sort translations.json alphabetically"
            git push
            echo "::error::translations.json was not sorted. Fixed and pushed. CI will re-run."
            exit 1
          fi

      - name: Sync hreflang blocks
        run: node scripts/sync-hreflang.mjs

      - name: Build OG images
        run: node scripts/build-og-images.mjs

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "chore: sync hreflang + og images [skip ci]"
            git push
          else
            echo "No changes to commit."
          fi
